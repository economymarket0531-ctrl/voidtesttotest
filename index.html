<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seu Nome | Links</title>
<meta name="theme-color" content="#0a0612">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}

/* ===== CORES ===== */
:root{
  --preto:#07030f; --roxo:#7c3aed; --roxo-claro:#c4a1ff; --texto:#f1e8ff;
  --vidro:rgba(14,7,28,.58); --borda:rgba(176,132,255,.38);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{
  background:var(--preto);color:var(--texto);
  font-family:"Outfit",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  display:flex;justify-content:center;align-items:flex-start;
  padding:48px 18px;overflow-x:hidden;
}

/* ===== FUNDO ===== */
#fundo{position:fixed;inset:0;z-index:-3;overflow:hidden;background:#0a0612 center/cover no-repeat}
#cena{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;
  filter:blur(7px) saturate(1.2);transform:scale(1.15);animation:cor 16s ease-in-out infinite}
@keyframes cor{
  0%,100%{filter:blur(7px) saturate(1.2) hue-rotate(-14deg)}
  50%{filter:blur(7px) saturate(1.35) hue-rotate(20deg)}}
#fundo.foto{filter:blur(8px) brightness(.55) saturate(1.2);animation:zoom 26s ease-in-out infinite alternate}
#fundo.foto #cena{display:none}
@keyframes zoom{from{transform:scale(1.1)}to{transform:scale(1.25) translate(-1.5%,1%)}}
#vinheta{position:fixed;inset:0;z-index:-2;animation:respira 7s ease-in-out infinite;
  background:radial-gradient(ellipse at 50% 30%,rgba(124,58,237,.14),rgba(7,3,15,.8) 85%)}
@keyframes respira{0%,100%{opacity:.85}50%{opacity:1}}
#luz{position:fixed;left:0;top:0;width:380px;height:380px;margin:-190px 0 0 -190px;border-radius:50%;
  background:radial-gradient(circle,rgba(168,85,247,.3),transparent 65%);
  pointer-events:none;z-index:-1;opacity:0;transition:opacity .5s}
#fx{position:fixed;inset:0;z-index:5;pointer-events:none}

/* ===== CARTÃO ===== */
main{
  position:relative;width:100%;max-width:440px;text-align:center;padding:38px 24px 28px;
  background:var(--vidro);border:1px solid rgba(176,132,255,.18);border-radius:26px;
  -webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
  animation:entra .9s cubic-bezier(.2,.8,.2,1) backwards,
            flutua 8s ease-in-out .9s infinite,
            pulsoCard 4s ease-in-out infinite;
}
main::before{ /* borda de luz girando */
  content:"";position:absolute;inset:-1px;border-radius:27px;padding:2px;pointer-events:none;
  background:conic-gradient(from var(--ang),#7c3aed,#f0e0ff,#d946ef,#4c1d95,#a855f7,#7c3aed);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;mask-composite:exclude;
  animation:giro 6s linear infinite;
}
@keyframes giro{to{--ang:360deg}}
@keyframes entra{from{opacity:0;transform:translateY(34px) scale(.95)}}
@keyframes flutua{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes pulsoCard{
  0%,100%{box-shadow:0 0 40px rgba(124,58,237,.22)}
  50%{box-shadow:0 0 95px rgba(168,85,247,.5)}}

/* ===== AVATAR ===== */
.avatar{
  position:relative;width:96px;height:96px;margin:0 auto 24px;border-radius:20px;
  display:grid;place-items:center;font:700 44px "Pixelify Sans",monospace;color:#fff;
  background:linear-gradient(145deg,#a855f7,#4c1d95);
  border:2px solid var(--roxo-claro);
  animation:balanca 5s ease-in-out infinite,brilhoAv 2.6s ease-in-out infinite;
}
.avatar::before,.avatar::after{content:"";position:absolute;pointer-events:none}
.avatar::before{inset:-11px;border:2px dashed rgba(196,161,255,.65);border-radius:30px;animation:gira 14s linear infinite}
.avatar::after{inset:-20px;border:1px dotted rgba(217,70,239,.6);border-radius:38px;animation:gira 22s linear infinite reverse}
img.avatar{object-fit:cover;display:block}
@keyframes gira{to{transform:rotate(360deg)}}
@keyframes balanca{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(3deg)}}
@keyframes brilhoAv{
  0%,100%{box-shadow:0 0 18px rgba(168,85,247,.5),inset 0 -6px 0 rgba(0,0,0,.25)}
  50%{box-shadow:0 0 44px rgba(217,70,239,.95),inset 0 -6px 0 rgba(0,0,0,.25)}}

/* ===== TEXTOS ===== */
h1{
  font:700 2.1rem "Pixelify Sans",monospace;letter-spacing:.02em;
  background:linear-gradient(90deg,#fff,#c4a1ff,#a855f7,#f0abfc,#fff);background-size:200% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  animation:fluxo 5s linear infinite,pulsoTxt 3s ease-in-out infinite;
}
@keyframes fluxo{to{background-position:200% 0}}
@keyframes pulsoTxt{
  0%,100%{filter:drop-shadow(0 0 6px rgba(168,85,247,.6))}
  50%{filter:drop-shadow(0 0 20px rgba(217,70,239,.95))}}
.bio{margin:10px auto 26px;max-width:32ch;min-height:3.1em;line-height:1.55;color:var(--roxo-claro)}
.cursor{display:inline-block;width:2px;height:1.1em;margin-left:3px;vertical-align:-.15em;background:#e9d5ff;animation:pisca 1s steps(1) infinite}
@keyframes pisca{50%{opacity:0}}

/* ===== BOTÕES ===== */
.links{list-style:none;padding:0;display:grid;gap:14px}
.links li{
  animation:sobe .75s cubic-bezier(.2,.8,.2,1) var(--d) backwards,
            bob 4.6s ease-in-out calc(var(--d) + .8s) infinite;
}
.links li:nth-child(1){--d:.45s}.links li:nth-child(2){--d:.6s}.links li:nth-child(3){--d:.75s}
.links li:nth-child(4){--d:.9s}.links li:nth-child(5){--d:1.05s}
@keyframes sobe{from{opacity:0;transform:translateY(30px) scale(.9)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}

.links a{
  position:relative;display:block;overflow:hidden;padding:15px 20px;border-radius:14px;
  color:var(--texto);text-decoration:none;font-weight:600;font-size:1.05rem;
  background:rgba(48,20,94,.45);border:1px solid var(--borda);
  animation:glow 3s ease-in-out var(--d) infinite;
  transition:transform .2s,background .2s,border-color .2s,letter-spacing .2s;
}
.links a::before{ /* foco de luz que segue o mouse */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .25s;
  background:radial-gradient(130px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.3),transparent 70%);
}
.links a::after{ /* brilho que passa sozinho */
  content:"";position:absolute;top:0;bottom:0;left:0;width:40%;pointer-events:none;
  background:linear-gradient(105deg,transparent,rgba(255,255,255,.35),transparent);
  transform:translateX(-160%) skewX(-20deg);
  animation:brilha 5s ease-in-out var(--d) infinite;
}
@keyframes brilha{0%,55%{transform:translateX(-160%) skewX(-20deg)}100%{transform:translateX(380%) skewX(-20deg)}}
@keyframes glow{
  0%,100%{box-shadow:0 0 6px rgba(124,58,237,.2)}
  50%{box-shadow:0 0 22px rgba(168,85,247,.55)}}
@keyframes glowForte{
  0%,100%{box-shadow:0 6px 26px rgba(124,58,237,.6)}
  50%{box-shadow:0 8px 44px rgba(217,70,239,.9)}}

.links a:hover,.links a:focus-visible{
  transform:translateY(-4px) scale(1.035);letter-spacing:.03em;
  background:rgba(124,58,237,.62);border-color:#e9d5ff;
  animation:glowForte 1.2s ease-in-out infinite;
}
.links a:hover::before{opacity:1}
.links a:hover::after{animation:brilha 1.1s ease-in-out infinite}
.links a:active{transform:scale(.96)}
.links a:focus-visible{outline:2px solid #fff;outline-offset:3px}

.links a.principal{
  border-color:#e9d5ff;
  background:linear-gradient(120deg,#6d28d9,#a855f7,#d946ef,#6d28d9);background-size:200% 100%;
  animation:fluxo 5s linear infinite,glow 2.4s ease-in-out infinite;
}
.links a.principal:hover,.links a.principal:focus-visible{animation:fluxo 2s linear infinite,glowForte 1.2s ease-in-out infinite}

.onda{position:absolute;width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.55);
  pointer-events:none;transform:translate(-50%,-50%) scale(0);animation:onda .65s ease-out forwards}
@keyframes onda{to{transform:translate(-50%,-50%) scale(24);opacity:0}}

footer{margin-top:30px;font-size:.82rem;color:var(--roxo-claro);animation:cintila 3.5s ease-in-out infinite}
@keyframes cintila{0%,100%{opacity:.35}50%{opacity:.85}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="fundo"><canvas id="cena"></canvas></div>
<div id="vinheta"></div>
<div id="luz"></div>
<canvas id="fx"></canvas>

<main>
  <!-- ===== EDITE AQUI: inicial, nome e frases que ficam se digitando ===== -->
  <div class="avatar" aria-hidden="true">S</div>
  <h1>Seu Nome</h1>
  <p class="bio"><span id="txt">Uma frase curta sobre você ou sobre o que você faz.</span><span class="cursor"></span></p>

  <!-- ===== EDITE AQUI: troque os links ===== -->
  <ul class="links">
    <li><a class="principal" href="#">Meu site</a></li>
    <li><a href="https://wa.me/55SEUNUMERO" target="_blank" rel="noopener noreferrer">WhatsApp</a></li>
    <li><a href="https://instagram.com/seuusuario" target="_blank" rel="noopener noreferrer">Instagram</a></li>
    <li><a href="#">YouTube</a></li>
    <li><a href="#">Discord</a></li>
  </ul>

  <footer>© 2026 Seu Nome</footer>
</main>

<script>
const calmo=matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ===== FRASES DIGITANDO EM LOOP (edite à vontade) ===== */
const frases=['Uma frase curta sobre você.','Criador de coisas legais.','Siga, entre, explore.'];
(function(){
  const el=document.getElementById('txt');
  if(calmo){el.textContent=frases[0];return}
  let f=0,i=0,apagando=false;
  (function passo(){
    const fr=frases[f];
    el.textContent=fr.slice(0,i);
    let t=apagando?28:60;
    if(!apagando&&i===fr.length){apagando=true;t=1900}
    else if(apagando&&i===0){apagando=false;f=(f+1)%frases.length;t=450}
    else i+=apagando?-1:1;
    setTimeout(passo,t);
  })();
})();

/* ===== CENA DE BLOCOS ANIMADA (borrada pelo CSS) ===== */
(function(){
  const c=document.getElementById('cena'),x=c.getContext('2d');
  const W=240,H=135,B=5,N=W/B;c.width=W;c.height=H;
  let s=11;const r=()=>(s=(s*16807)%2147483647)/2147483647;

  const ceu=document.createElement('canvas');ceu.width=W;ceu.height=H;
  const cx=ceu.getContext('2d'),top=[8,5,18],bot=[104,46,178];
  for(let y=0;y<H;y+=3){
    const k=Math.pow(y/H,1.5);
    cx.fillStyle='rgb('+top.map((v,i)=>Math.round(v+(bot[i]-v)*k))+')';
    cx.fillRect(0,y,W,3);
  }
  const estrelas=Array.from({length:90},()=>({x:Math.floor(r()*W),y:Math.floor(r()*H*.55),f:.6+r()*2.2,p:r()*6.28}));
  const nuvens=Array.from({length:5},()=>({x:r()*W,y:12+r()*36,w:20+r()*28,v:1.2+r()*1.6}));
  const camadas=[
    {b:.60,a:10,cor:'#52248f',v:1.5},{b:.70,a:9,cor:'#331566',v:3},
    {b:.80,a:8,cor:'#1a0a36',v:5},{b:.91,a:6,cor:'#07030f',v:8}
  ].map((L,k)=>{
    L.h=[];L.t=[];
    for(let j=0;j<N;j++){
      const a=j/N*6.2832;
      L.h.push(Math.round((L.b*H+Math.sin(a*2+k*2)*L.a+Math.sin(a*5+k)*L.a*.4)/B)*B);
      L.t.push(k>0&&k<3&&r()<.13);
    }
    return L;
  });

  function coluna(L,px,j){
    const h=L.h[j];
    x.fillStyle=L.cor;x.fillRect(px,h,B,H-h);
    x.fillStyle='rgba(255,255,255,.07)';x.fillRect(px,h,B,B);
    if(L.t[j]){x.fillStyle=L.cor;x.fillRect(px,h-3*B,B,3*B);x.fillRect(px-B,h-4*B,3*B,2*B);x.fillRect(px,h-5*B,B,B)}
  }

  let ultimo=0;
  function quadro(ms){
    if(!calmo)requestAnimationFrame(quadro);
    if(ms-ultimo<33)return;ultimo=ms;
    const t=ms/1000;
    x.drawImage(ceu,0,0);
    estrelas.forEach(e=>{
      x.fillStyle='rgba(235,222,255,'+(.12+.88*(.5+.5*Math.sin(t*e.f+e.p)))+')';
      x.fillRect(e.x,e.y,1,1);
    });
    const mx=Math.floor(W*.72),my=16,g=.5+.5*Math.sin(t*1.3);
    x.fillStyle='rgba(200,170,255,'+(.06+.08*g)+')';x.fillRect(mx-14,my-14,40,40);
    x.fillStyle='rgba(200,170,255,'+(.12+.12*g)+')';x.fillRect(mx-6,my-6,24,24);
    x.fillStyle='#f3ecff';x.fillRect(mx,my,12,12);
    x.fillStyle='rgba(170,120,255,.16)';
    nuvens.forEach(n=>{
      const px=((n.x+t*n.v)%(W+n.w+20))-n.w;
      x.fillRect(px,n.y,n.w,B);x.fillRect(px+B,n.y-B,n.w-3*B,B);
    });
    const ciclo=Math.floor(t/9),ph=(t%9)/1.3;
    if(ph<1){
      const sx=20+((ciclo*97)%100)*1.2,sy=6+((ciclo*53)%30);
      for(let k=0;k<10;k++){
        x.fillStyle='rgba(255,240,255,'+(1-k/10)*(1-ph*.6)+')';
        x.fillRect(Math.round(sx+ph*120-k*3),Math.round(sy+ph*50-k*1.25),2,2);
      }
    }
    camadas.forEach(L=>{
      const off=t*L.v;
      for(let j=0;j<N;j++){
        const px=(((j*B-off)%W)+W)%W;
        coluna(L,px,j);
        if(px+B>W)coluna(L,px-W,j);
      }
    });
  }
  requestAnimationFrame(quadro);
})();

/* ===== PARTÍCULAS NÍTIDAS + CLIQUE + RASTRO ===== */
(function(){
  const c=document.getElementById('fx'),x=c.getContext('2d');
  let w,h;
  function tam(){w=c.width=innerWidth;h=c.height=innerHeight}
  tam();addEventListener('resize',tam);
  const cores=['#c4a1ff','#a855f7','#e9d5ff','#d946ef'];
  const pick=()=>cores[Math.floor(Math.random()*cores.length)];
  const motes=Array.from({length:38},()=>({
    x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:2+Math.floor(Math.random()*3),
    v:12+Math.random()*30,o:Math.random()*40,f:.5+Math.random()*1.5,p:Math.random()*6.28,c:pick()}));
  const ps=[];
  function burst(px,py,n){
    for(let i=0;i<n;i++){
      const a=Math.random()*6.2832,v=60+Math.random()*170;
      ps.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v,s:3+Math.floor(Math.random()*4),l:0,m:.7+Math.random()*.5,c:pick()});
    }
  }
  let u=0,mv=0;
  function loop(ms){
    if(!calmo)requestAnimationFrame(loop);
    const dt=Math.min((ms-u)/1000,.05);u=ms;const t=ms/1000;
    x.clearRect(0,0,w,h);x.shadowBlur=12;
    motes.forEach(m=>{
      m.y-=m.v*dt;if(m.y<-10){m.y=h+10;m.x=Math.random()*w}
      const px=m.x+Math.sin(t*m.f+m.p)*m.o;
      x.shadowColor=m.c;x.fillStyle=m.c;
      x.globalAlpha=.25+.55*(.5+.5*Math.sin(t*2*m.f+m.p));
      x.fillRect(Math.round(px),Math.round(m.y),m.s,m.s);
    });
    for(let i=ps.length-1;i>=0;i--){
      const p=ps[i];p.l+=dt;
      if(p.l>p.m){ps.splice(i,1);continue}
      p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy=p.vy*.96+120*dt;
      x.shadowColor=p.c;x.fillStyle=p.c;x.globalAlpha=1-p.l/p.m;
      x.fillRect(Math.round(p.x),Math.round(p.y),p.s,p.s);
    }
    x.globalAlpha=1;
  }
  requestAnimationFrame(loop);

  const luz=document.getElementById('luz');
  addEventListener('pointermove',e=>{
    luz.style.opacity=1;luz.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)';
    if(!calmo&&++mv%3===0)ps.push({x:e.clientX,y:e.clientY,vx:(Math.random()-.5)*40,vy:(Math.random()-.5)*40,s:2,l:0,m:.6,c:pick()});
  });
  addEventListener('pointerdown',e=>{if(!calmo)burst(e.clientX,e.clientY,20)});
})();

/* ===== BOTÕES: foco de luz e onda no clique ===== */
document.querySelectorAll('.links a').forEach(a=>{
  a.addEventListener('pointermove',e=>{
    const b=a.getBoundingClientRect();
    a.style.setProperty('--mx',(e.clientX-b.left)+'px');
    a.style.setProperty('--my',(e.clientY-b.top)+'px');
  });
  a.addEventListener('pointerdown',e=>{
    const b=a.getBoundingClientRect(),o=document.createElement('span');
    o.className='onda';o.style.left=(e.clientX-b.left)+'px';o.style.top=(e.clientY-b.top)+'px';
    a.appendChild(o);setTimeout(()=>o.remove(),700);
  });
});

/* Quer usar um print seu de fundo? Suba uma imagem chamada fundo.jpg no repositório. */
(function(){
  const im=new Image();
  im.onload=function(){
    const f=document.getElementById('fundo');
    f.style.backgroundImage='url(fundo.jpg)';f.classList.add('foto');
  };
  im.src='fundo.jpg';
})();
</script>
</body>
</html>
